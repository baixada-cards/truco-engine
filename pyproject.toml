[project]
name = "baixada-truco-engine"
version = "0.1.0"
description = "Python development binding for Baixada's authoritative Truco engine"
authors = [
    { name = "Elvis Sikora" },
    { name = "Baixada contributors" },
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.uv.pip]
exclude-newer = "7 days"
