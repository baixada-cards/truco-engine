version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      rust:
        patterns:
          - "*"
    ignore:
      # rand is pinned to 0.8 for two independent reasons; both must be
      # resolved before this ignore is lifted.
      #
      # 1. Reproducibility. rand 0.9 rewrote small-range integer sampling, so
      #    gen_range over a small range -- and therefore every shuffle -- draws
      #    differently from the same seed (measured across seeds 0/1/42/999983;
      #    large-range gen_range, f64 ranges, and gen_bool are unaffected).
      #    sample_weighted_index draws gen_range(0..total_weight) with small
      #    weights, and truco-spec's seeded exploration fixtures record which
      #    branch each seed selects. Bumping rand silently changes a published
      #    contract. See "Sampling Determinism" in the exploration CONTRACT.
      # 2. Trait coupling. bot_analysis::analyze_tactical_turn_sampled<R: Rng>
      #    takes the caller's RNG, and truco-bots passes its own StdRng into
      #    it, which truco-server in turn instantiates. A 0.9 RNG cannot
      #    satisfy a 0.8 Rng bound, so engine, bots, and server move together
      #    or not at all.
      #
      # Note the usual security argument does not apply: rand is built without
      # its serde feature here, so the UniformChar Deserialize fix in 0.9.5 is
      # not in a compiled code path.
      - dependency-name: rand
        versions:
          - ">= 0.9"

  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      typescript:
        patterns:
          - "*"
    ignore:
      # Compiler and Node declaration majors require an intentional migration.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
